<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Room {{ room.code }} - Movie Matcher</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/hammer.js/2.0.8/hammer.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.2/anime.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #07090e;
      color: #f8fafc;
      height: 100dvh;
      width: 100vw;
      overflow: hidden;
      touch-action: pan-y;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .ambient-glow {
      position: absolute;
      border-radius: 50%;
      filter: blur(120px);
      pointer-events: none;
      opacity: 0.25;
    }
    .card-stack {
      position: relative;
      width: 320px;
      height: 460px;
      max-width: calc(100vw - 32px);
      max-height: calc(100dvh - 250px);
      perspective: 1000px;
    }
    .movie-card {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border-radius: 1.5rem;
      overflow: hidden;
      box-shadow: 0 20px 45px -10px rgba(0, 0, 0, 0.9), 0 0 0 1px rgba(255, 255, 255, 0.08);
      touch-action: none;
      cursor: grab;
      will-change: transform, opacity;
      transform-style: preserve-3d;
    }
    .movie-card:active {
      cursor: grabbing;
    }
    .stamp-badge {
      position: absolute;
      top: 1.25rem;
      padding: 0.35rem 0.9rem;
      font-weight: 900;
      font-size: 1.2rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      border-radius: 0.75rem;
      border-width: 3px;
      opacity: 0;
      pointer-events: none;
      z-index: 40;
      transition: opacity 0.1s ease;
      box-shadow: 0 10px 20px rgba(0,0,0,0.5);
    }
    .stamp-like {
      left: 1.25rem;
      color: #34d399;
      border-color: #34d399;
      background: rgba(6, 78, 59, 0.8);
      transform: rotate(-15deg);
    }
    .stamp-nope {
      right: 1.25rem;
      color: #f87171;
      border-color: #f87171;
      background: rgba(127, 29, 29, 0.8);
      transform: rotate(15deg);
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="flex flex-col justify-between selection:bg-amber-500 relative">

  <!-- Ambient Glows -->
  <div id="glow-1" class="ambient-glow w-96 h-96 bg-amber-500/15 -top-20 -left-20"></div>
  <div id="glow-2" class="ambient-glow w-96 h-96 bg-indigo-600/20 -bottom-20 -right-20"></div>

  <!-- 1. TOP HEADER -->
  <header class="w-full max-w-xl mx-auto px-4 pt-3 pb-1 z-30 shrink-0">
    <div class="flex items-center justify-between gap-3">
      <div class="flex items-center gap-2.5">
        <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-amber-500 to-amber-300 flex items-center justify-center text-slate-950 font-black text-sm shadow-md shadow-amber-500/20">
          🍿
        </div>
        <div>
          <h1 class="text-sm font-extrabold tracking-tight text-white leading-tight">Movie Night</h1>
          <p class="text-[10px] text-slate-400 font-medium">Room <span class="font-mono text-amber-400 font-bold tracking-wider">{{ room.code }}</span></p>
        </div>
      </div>

      <!-- Live Member Badges -->
      <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar py-0.5 max-w-[50%]">
        <div id="members-list" class="flex gap-1.5">
          <span class="text-[10px] bg-amber-500/15 text-amber-300 border border-amber-500/30 px-2.5 py-0.5 rounded-lg font-semibold whitespace-nowrap">{{ member.user_name }} (You)</span>
        </div>
      </div>

      <button id="btn-copy" onclick="copyInvite()" class="text-xs bg-slate-800/90 hover:bg-slate-700 active:scale-95 border border-slate-700/80 px-3 py-1.5 rounded-xl text-slate-200 hover:text-white transition flex items-center gap-1.5 shadow-sm">
        <span class="text-xs">📋</span>
        <span id="copy-text" class="font-medium text-[10px]">Share</span>
      </button>
    </div>
  </header>

  <!-- 2. MAIN SWIPE STAGE -->
  <main class="relative w-full flex-1 flex flex-col items-center justify-center px-4 min-h-0 z-20">
    
    <!-- Staged Card Deck Container -->
    <div id="card-stack" class="card-stack flex items-center justify-center"></div>

    <!-- Controls Row -->
    <div class="flex items-center justify-center gap-6 mt-4 z-30 shrink-0">
      <button 
        id="btn-pass" 
        aria-label="Pass" 
        class="w-13 h-13 sm:w-14 sm:h-14 p-3.5 rounded-full bg-slate-900/90 border border-slate-700 flex items-center justify-center text-rose-400 text-xl font-bold shadow-xl hover:bg-rose-950/40 hover:border-rose-600/60 active:scale-90 transition"
      >
        <svg class="w-6 h-6 stroke-current stroke-[2.5]" viewBox="0 0 24 24" fill="none">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>

      <button 
        id="btn-like" 
        aria-label="Like" 
        class="w-14 h-14 sm:w-16 sm:h-16 p-4 rounded-full bg-gradient-to-tr from-amber-500 to-amber-400 flex items-center justify-center text-slate-950 text-2xl font-black shadow-xl shadow-amber-500/25 hover:from-amber-400 hover:to-amber-300 active:scale-90 transition"
      >
        <svg class="w-7 h-7 fill-current" viewBox="0 0 24 24">
          <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
        </svg>
      </button>
    </div>

    <!-- Match Banner Overlay -->
    <div id="match-banner" class="fixed top-4 z-50 bg-gradient-to-r from-amber-500 to-amber-400 text-slate-950 px-4 py-1.5 rounded-full font-black text-xs shadow-2xl flex items-center gap-2 transform -translate-y-24 opacity-0 pointer-events-none">
      <span class="text-base">🎉</span> <span id="banner-text">It's a Match!</span>
    </div>
  </main>

  <!-- 3. FULL-WIDTH BOTTOM SHELF -->
  <footer id="matches-shelf" class="w-full bg-[#0d131f]/95 border-t border-slate-800/80 backdrop-blur-xl px-4 sm:px-6 pt-2 pb-2.5 z-30 shrink-0">
    <div class="w-full">
      <div class="flex items-center justify-between mb-1.5 px-0.5">
        <div class="flex items-center gap-2">
          <span class="text-xs uppercase font-extrabold tracking-wider text-amber-400 flex items-center gap-1.5">
            Matches
          </span>
          <span id="match-counter" class="bg-amber-500/20 text-amber-300 border border-amber-500/30 text-[10px] font-bold px-2 py-0.5 rounded-md">0</span>
        </div>
        <span class="text-[10px] text-slate-400 font-medium">Tap any match for details</span>
      </div>

      <div id="matched-movies-container" class="flex gap-2.5 overflow-x-auto no-scrollbar py-0.5 items-center min-h-[54px] w-full">
        <div id="empty-matches" class="text-xs text-slate-500 py-2 w-full text-center font-medium">
          Swipe right together to find mutual picks!
        </div>
      </div>
    </div>
  </footer>

  <!-- 4. MOVIE DETAILS MODAL -->
  <div id="movie-modal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-4 opacity-0 pointer-events-none transition-opacity duration-300">
    <div id="modal-content" class="bg-slate-900/95 border border-slate-700/80 rounded-3xl max-w-sm w-full overflow-hidden shadow-2xl transform scale-95 transition-transform duration-300 flex flex-col max-h-[85vh]">
      
      <div class="relative w-full aspect-[16/10] bg-slate-950 overflow-hidden shrink-0">
        <img id="modal-poster" src="" alt="Movie Poster" referrerpolicy="no-referrer" crossorigin="anonymous" class="w-full h-full object-cover">
        <div class="absolute inset-0 bg-gradient-to-t from-slate-900 via-transparent to-black/40"></div>
        
        <button onclick="closeModal()" class="absolute top-3 right-3 w-8 h-8 rounded-full bg-slate-900/80 border border-slate-700/60 text-white flex items-center justify-center hover:bg-slate-800 transition active:scale-95">
          ✕
        </button>

        <div class="absolute bottom-3 left-4 right-4">
          <div class="flex items-center gap-1.5 mb-1 flex-wrap" id="modal-badges"></div>
          <h3 id="modal-title" class="text-lg font-black text-white leading-tight drop-shadow-md"></h3>
        </div>
      </div>

      <div class="p-4 sm:p-5 overflow-y-auto no-scrollbar space-y-3.5">
        <div>
          <span class="text-[10px] font-bold uppercase tracking-wider text-amber-400">Overview</span>
          <p id="modal-overview" class="text-xs text-slate-300 mt-1 leading-relaxed"></p>
        </div>

        <div>
          <span class="text-[10px] font-bold uppercase tracking-wider text-amber-400">Streaming Providers</span>
          <div id="modal-providers" class="flex flex-wrap gap-1.5 mt-1.5"></div>
        </div>

        <div class="pt-2">
          <a id="modal-tmdb-link" href="#" target="_blank" rel="noopener noreferrer" class="w-full py-2.5 px-4 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-xs rounded-xl flex items-center justify-center gap-2 transition active:scale-95 shadow-md">
            <span>View on TMDB</span>
            <svg class="w-3.5 h-3.5 stroke-current stroke-2" fill="none" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3"/>
            </svg>
          </a>
        </div>
      </div>

    </div>
  </div>

  <!-- Raw Django JSON Script Tag -->
  <script id="movies-data" type="application/json">
    {{ movies_json|safe }}
  </script>

  <script>
    const roomCode = "{{ room.code }}";
    const memberId = "{{ member.id }}";
    const currentUserName = "{{ member.user_name }}";

    // Resilient Parser for JSON injected via Django
    let movies = [];
    try {
      const dataEl = document.getElementById('movies-data');
      if (dataEl) {
        let content = dataEl.textContent.trim();
        if (content) {
          let parsed = JSON.parse(content);
          // Handle stringified JSON layers
          while (typeof parsed === 'string') {
            parsed = JSON.parse(parsed);
          }
          if (Array.isArray(parsed)) {
            movies = parsed;
          }
        }
      }
    } catch (err) {
      console.warn("Could not parse movies-data directly:", err);
      movies = [];
    }

    const stack = document.getElementById('card-stack');
    let currentPage = 1;
    let isFetchingMore = false;
    const matchedMovieIds = new Set();
    const matchedMoviesCache = new Map();

    // Web Audio Synthesizer
    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playTone(freq, type = 'sine', duration = 0.15) {
      try {
        initAudio();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {
        console.warn("Audio error:", e);
      }
    }

    function playMatchFanfare() {
      [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
        setTimeout(() => playTone(freq, 'triangle', 0.25), idx * 110);
      });
    }

    // Dynamic fetch threshold check
    async function checkDeckThreshold() {
      if (movies.length <= 3 && !isFetchingMore) {
        isFetchingMore = true;
        currentPage += 1;
        try {
          const res = await fetch(`/room/${roomCode}/more/?page=${currentPage}`);
          const data = await res.json();
          if (data.movies && data.movies.length > 0) {
            const currentIds = new Set(movies.map(m => m.id));
            const newUniqueMovies = data.movies.filter(m => !currentIds.has(m.id));
            if (newUniqueMovies.length > 0) {
              movies.push(...newUniqueMovies);
              renderCards();
            }
          }
        } catch (e) {
          console.error("Pagination fetch error:", e);
        } finally {
          isFetchingMore = false;
        }
      }
    }

    // Reconnecting WebSocket Client
    let socket = null;
    let reconnectAttempts = 0;
    const maxReconnectAttempts = 10;
    let reconnectTimer = null;

    function connectWebSocket() {
      const wsScheme = window.location.protocol === "https:" ? "wss" : "ws";
      const wsUrl = `${wsScheme}://${window.location.host}/ws/room/${roomCode}/`;

      socket = new WebSocket(wsUrl);

      socket.onopen = function() {
        reconnectAttempts = 0;
        socket.send(JSON.stringify({
          action: 'join_presence',
          member_id: memberId,
          user_name: currentUserName
        }));
      };

      socket.onmessage = function(e) {
        try {
          const data = JSON.parse(e.data);
          if (data.event === 'MATCH_FOUND') {
            handleMutualMatch(data.movie);
          } else if (data.event === 'MEMBERS_UPDATE') {
            renderMembers(data.members);
          }
        } catch (err) {
          console.error("Socket error processing message:", err);
        }
      };

      socket.onclose = function() {
        if (reconnectAttempts < maxReconnectAttempts) {
          const delay = Math.min(1000 * Math.pow(1.5, reconnectAttempts), 10000);
          reconnectAttempts++;
          clearTimeout(reconnectTimer);
          reconnectTimer = setTimeout(connectWebSocket, delay);
        }
      };

      socket.onerror = function() {
        socket.close();
      };
    }

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') {
        if (!socket || socket.readyState === WebSocket.CLOSED) {
          connectWebSocket();
        }
      }
    });

    connectWebSocket();

    function renderMembers(members) {
      const list = document.getElementById('members-list');
      if (!list) return;
      list.innerHTML = '';

      const uniqueMembers = [...new Set(members)];
      uniqueMembers.forEach(name => {
        const isSelf = name.toLowerCase() === currentUserName.toLowerCase();
        const pill = document.createElement('span');
        pill.className = `text-[10px] px-2 py-0.5 rounded-lg border transition whitespace-nowrap ${
          isSelf 
            ? 'bg-amber-500/15 text-amber-300 border-amber-500/30 font-semibold' 
            : 'bg-slate-800/80 text-slate-300 border-slate-700/60 font-medium'
        }`;
        pill.textContent = isSelf ? `${name} (You)` : name;
        list.appendChild(pill);
      });
    }

    function renderCards() {
      stack.innerHTML = '';
      if (!Array.isArray(movies) || movies.length === 0) {
        stack.innerHTML = `
          <div class="flex flex-col items-center justify-center w-full h-full text-center p-6 bg-slate-900/60 rounded-3xl border border-slate-800 shadow-xl">
            <span class="text-4xl mb-3">🎬</span>
            <p class="text-slate-200 font-bold text-sm">No more cards available</p>
            <p class="text-slate-500 text-xs mt-1">Check bottom tray for matches or start a new session.</p>
          </div>`;
        return;
      }

      const visibleMovies = movies.slice(0, 3);

      visibleMovies.forEach((movie, index) => {
        const card = document.createElement('div');
        card.className = 'movie-card bg-slate-900 flex flex-col justify-end text-white';
        card.style.zIndex = visibleMovies.length - index;

        if (index > 0) {
          const scale = 1 - index * 0.05;
          const translateY = index * 10;
          card.style.transform = `scale(${scale}) translateY(${translateY}px)`;
          card.style.opacity = `${1 - index * 0.28}`;
          card.style.pointerEvents = 'none';
        }

        const providerTags = movie.providers && movie.providers.length > 0 
          ? movie.providers.map(p => `<span class="bg-blue-600/80 border border-blue-400/30 text-[10px] px-2 py-0.5 rounded-md font-bold tracking-tight">${p}</span>`).join(' ') 
          : '';

        const year = movie.release_date ? movie.release_date.split('-')[0] : 'N/A';
        const rating = movie.vote_average ? Number(movie.vote_average).toFixed(1) : 'NR';

        card.innerHTML = `
          <div class="stamp-badge stamp-like">LIKE</div>
          <div class="stamp-badge stamp-nope">NOPE</div>

          <img 
            src="https://image.tmdb.org/t/p/w500${movie.poster_path}" 
            referrerpolicy="no-referrer"
            crossorigin="anonymous"
            alt="${movie.title}"
            class="absolute inset-0 w-full h-full object-cover object-center pointer-events-none"
            onerror="this.onerror=null; this.src='https://placehold.co/500x750/1e293b/e2e8f0?text=' + encodeURIComponent('${(movie.title || "Movie").replace(/'/g, "\\'")}');"
          />
          <div class="absolute inset-0 bg-gradient-to-t from-slate-950 via-slate-950/40 to-transparent pointer-events-none"></div>
          
          <div class="relative p-4 sm:p-5 z-10 pointer-events-none">
            <div class="flex items-center gap-1.5 mb-1 flex-wrap">
              <span class="bg-amber-400 text-slate-950 font-black text-xs px-2 py-0.5 rounded">★ ${rating}</span>
              <span class="text-xs text-slate-200 font-bold bg-black/50 px-2 py-0.5 rounded backdrop-blur-sm">${year}</span>
              ${providerTags}
            </div>
            <h2 class="text-base sm:text-lg font-black tracking-tight text-white drop-shadow leading-tight line-clamp-1">${movie.title}</h2>
            <p class="text-[11px] text-slate-300 line-clamp-2 mt-0.5 leading-snug opacity-90">${movie.overview || 'No synopsis available.'}</p>
          </div>
        `;
        stack.appendChild(card);

        if (index === 0) {
          initHammer(card, movie);
          initCardParallax(card);
        }
      });
    }

    function initCardParallax(el) {
      el.addEventListener('mousemove', (e) => {
        const rect = el.getBoundingClientRect();
        const x = e.clientX - rect.left - rect.width / 2;
        const y = e.clientY - rect.top - rect.height / 2;
        const rotX = (y / (rect.height / 2)) * -8;
        const rotY = (x / (rect.width / 2)) * 8;
        el.style.transform = `perspective(1000px) rotateX(${rotX}deg) rotateY(${rotY}deg) scale(1.015)`;
      });

      el.addEventListener('mouseleave', () => {
        anime({
          targets: el,
          rotateX: 0,
          rotateY: 0,
          scale: 1,
          duration: 350,
          easing: 'easeOutQuad'
        });
      });
    }

    function initHammer(el, movie) {
      const hammertime = new Hammer(el);
      const stampLike = el.querySelector('.stamp-like');
      const stampNope = el.querySelector('.stamp-nope');

      hammertime.on('pan', (ev) => {
        el.style.transform = `translate(${ev.deltaX}px, ${ev.deltaY * 0.6}px) rotate(${ev.deltaX * 0.05}deg)`;

        if (ev.deltaX > 20) {
          stampLike.style.opacity = Math.min(ev.deltaX / 90, 1);
          stampNope.style.opacity = 0;
        } else if (ev.deltaX < -20) {
          stampNope.style.opacity = Math.min(-ev.deltaX / 90, 1);
          stampLike.style.opacity = 0;
        } else {
          stampLike.style.opacity = 0;
          stampNope.style.opacity = 0;
        }
      });

      hammertime.on('panend', (ev) => {
        stampLike.style.opacity = 0;
        stampNope.style.opacity = 0;

        if (ev.deltaX > 90) {
          triggerVote(el, movie, 'like');
        } else if (ev.deltaX < -90) {
          triggerVote(el, movie, 'pass');
        } else {
          anime({
            targets: el,
            translateX: 0,
            translateY: 0,
            rotate: 0,
            duration: 250,
            easing: 'easeOutElastic(1, .7)'
          });
        }
      });
    }

    function triggerVote(el, movie, direction) {
      const flyX = direction === 'like' ? 650 : -650;
      const flyRotate = direction === 'like' ? 35 : -35;

      if (direction === 'like') {
        playTone(587.33, 'sine', 0.1);
        if (socket && socket.readyState === WebSocket.OPEN) {
          socket.send(JSON.stringify({
            action: 'swipe_right',
            movie_id: movie.id,
            member_id: memberId,
            movie: movie
          }));
        }
      } else {
        playTone(220, 'sine', 0.08);
      }

      const btn = direction === 'like' ? document.getElementById('btn-like') : document.getElementById('btn-pass');
      anime({
        targets: btn,
        scale: [1, 1.2, 1],
        duration: 300,
        easing: 'easeInOutQuad'
      });

      anime({
        targets: el,
        translateX: flyX,
        translateY: 30,
        rotate: flyRotate,
        opacity: 0,
        duration: 280,
        easing: 'easeInCubic',
        complete: () => {
          movies.shift();
          renderCards();
          checkDeckThreshold();
        }
      });
    }

    document.getElementById('btn-like').addEventListener('click', () => {
      const topCard = stack.querySelector('.movie-card');
      if (topCard && movies.length > 0) triggerVote(topCard, movies[0], 'like');
    });

    document.getElementById('btn-pass').addEventListener('click', () => {
      const topCard = stack.querySelector('.movie-card');
      if (topCard && movies.length > 0) triggerVote(topCard, movies[0], 'pass');
    });

    function handleMutualMatch(movie) {
      if (matchedMovieIds.has(movie.id)) return;
      matchedMovieIds.add(movie.id);
      matchedMoviesCache.set(String(movie.id), movie);

      playMatchFanfare();
      
      if (typeof confetti === 'function') {
        confetti({ particleCount: 65, spread: 60, origin: { x: 0.15, y: 0.85 } });
        confetti({ particleCount: 65, spread: 60, origin: { x: 0.85, y: 0.85 } });
      }

      const shelf = document.getElementById('matches-shelf');
      shelf.classList.add('border-amber-500');
      setTimeout(() => shelf.classList.remove('border-amber-500'), 2000);

      const banner = document.getElementById('match-banner');
      document.getElementById('banner-text').textContent = `Matched: ${movie.title}!`;
      anime({
        targets: banner,
        translateY: [ -80, 0 ],
        opacity: [ 0, 1 ],
        duration: 450,
        easing: 'easeOutBounce'
      });
      setTimeout(() => {
        anime({
          targets: banner,
          translateY: -80,
          opacity: 0,
          duration: 350,
          easing: 'easeInQuad'
        });
      }, 3500);

      const emptyState = document.getElementById('empty-matches');
      if (emptyState) emptyState.remove();

      document.getElementById('match-counter').textContent = matchedMovieIds.size;

      const container = document.getElementById('matched-movies-container');
      const item = document.createElement('div');
      item.className = 'shrink-0 flex items-center gap-2 bg-slate-800/90 border border-amber-500/40 rounded-xl p-1.5 pr-3 shadow-lg max-w-[200px] opacity-0 scale-50 hover:border-amber-400 active:scale-95 transition cursor-pointer';
      
      item.addEventListener('click', () => openModal(movie));

      item.innerHTML = `
        <img 
          src="https://image.tmdb.org/t/p/w200${movie.poster_path}" 
          referrerpolicy="no-referrer"
          crossorigin="anonymous"
          alt="${movie.title}"
          class="w-8 h-11 object-cover rounded-md shrink-0 shadow pointer-events-none"
          onerror="this.onerror=null; this.src='https://placehold.co/100x150/1e293b/e2e8f0?text=Poster';"
        />
        <div class="overflow-hidden pointer-events-none">
          <p class="text-[11px] font-bold text-white truncate leading-tight">${movie.title}</p>
          <div class="flex items-center gap-1 mt-0.5">
            <span class="text-[10px] text-amber-300 font-extrabold">★ ${Number(movie.vote_average || 0).toFixed(1)}</span>
            <span class="text-[9px] text-slate-400">• ${movie.release_date ? movie.release_date.split('-')[0] : ''}</span>
          </div>
        </div>
      `;

      container.prepend(item);

      anime({
        targets: item,
        scale: [0.5, 1],
        opacity: [0, 1],
        duration: 500,
        easing: 'easeOutElastic(1, .5)'
      });
    }

    function openModal(movie) {
      const modal = document.getElementById('movie-modal');
      const content = document.getElementById('modal-content');
      
      const poster = document.getElementById('modal-poster');
      poster.src = movie.poster_path 
        ? `https://image.tmdb.org/t/p/w780${movie.poster_path}` 
        : `https://placehold.co/500x300/1e293b/e2e8f0?text=${encodeURIComponent(movie.title)}`;
      poster.onerror = () => { poster.src = `https://placehold.co/500x300/1e293b/e2e8f0?text=${encodeURIComponent(movie.title)}`; };

      document.getElementById('modal-title').textContent = movie.title;
      document.getElementById('modal-overview').textContent = movie.overview || "No overview available for this movie.";
      
      const year = movie.release_date ? movie.release_date.split('-')[0] : 'N/A';
      const rating = movie.vote_average ? Number(movie.vote_average).toFixed(1) : 'NR';
      
      document.getElementById('modal-badges').innerHTML = `
        <span class="bg-amber-400 text-slate-950 font-black text-xs px-2 py-0.5 rounded">★ ${rating}</span>
        <span class="text-xs text-slate-200 font-bold bg-black/60 px-2 py-0.5 rounded backdrop-blur-sm">${year}</span>
      `;

      const provContainer = document.getElementById('modal-providers');
      provContainer.innerHTML = '';
      if (movie.providers && movie.providers.length > 0) {
        movie.providers.forEach(prov => {
          const span = document.createElement('span');
          span.className = 'bg-blue-600/70 border border-blue-400/30 text-white text-[11px] px-2.5 py-0.5 rounded-lg font-medium';
          span.textContent = prov;
          provContainer.appendChild(span);
        });
      } else {
        provContainer.innerHTML = '<span class="text-xs text-slate-400 italic">No direct streaming providers listed</span>';
      }

      document.getElementById('modal-tmdb-link').href = `https://www.themoviedb.org/movie/${movie.id}`;

      modal.classList.remove('opacity-0', 'pointer-events-none');
      content.classList.remove('scale-95');
      content.classList.add('scale-100');
    }

    function closeModal() {
      const modal = document.getElementById('movie-modal');
      const content = document.getElementById('modal-content');
      modal.classList.add('opacity-0', 'pointer-events-none');
      content.classList.remove('scale-100');
      content.classList.add('scale-95');
    }

    document.getElementById('movie-modal').addEventListener('click', (e) => {
      if (e.target.id === 'movie-modal') closeModal();
    });

    function copyInvite() {
      navigator.clipboard.writeText(roomCode);
      const text = document.getElementById('copy-text');
      text.textContent = 'Copied!';
      anime({
        targets: '#btn-copy',
        scale: [1, 1.08, 1],
        duration: 300,
        easing: 'easeInOutQuad'
      });
      setTimeout(() => { text.textContent = 'Share'; }, 2000);
    }

    // Initial render: if array is empty on startup, attempt automatic fetch recovery
    if (!movies || movies.length === 0) {
      fetch(`/room/${roomCode}/more/?page=1`)
        .then(res => res.json())
        .then(data => {
          if (data.movies && data.movies.length > 0) {
            movies = data.movies;
            renderCards();
          } else {
            renderCards();
          }
        })
        .catch(() => renderCards());
    } else {
      renderCards();
    }
  </script>
</body>
</html>
